name: CI (Release)
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Publish
      run: dotnet publish -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained false .\Dotstrap\Dotstrap.csproj

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Dotstrap (Release) (${{ github.sha }})
        path: .\Dotstrap\bin\Release\net8.0-windows\win-x64\publish\*
