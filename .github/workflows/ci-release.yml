name: CI (Release)
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    # needed to create releases
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Publish
      run: dotnet publish -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained false .\Dotstrap\Dotstrap.csproj

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Dotstrap (Release) (${{ github.sha }})
        path: .\Dotstrap\bin\Release\net8.0-windows\win-x64\publish\*

    # a pushed vX.Y.Z tag becomes a release with the exe as its first (and only) asset, which is what the updater downloads
    - name: Publish GitHub release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        [xml]$project = Get-Content .\Dotstrap\Dotstrap.csproj
        $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]

        if ("v$version" -ne $env:TAG) {
          throw "Tag $env:TAG does not match the project version $version"
        }

        $exe = ".\Dotstrap\bin\Release\net8.0-windows\win-x64\publish\Dotstrap.exe"

        gh release view $env:TAG *> $null

        if ($LASTEXITCODE -eq 0) {
          # release was made by hand - swap in the CI build
          gh release upload $env:TAG $exe --clobber
        } else {
          gh release create $env:TAG $exe --title "Dotstrap $env:TAG" --generate-notes
        }

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
